<!DOCTYPE html>
<html>
<head>
    <title>Stripe Payment Test</title>

    <script src="https://js.stripe.com/v3/"></script>

    <style>

        body{
            font-family: Arial;
            margin:50px;
        }

        #card-element{
            width:350px;
            border:1px solid #ccc;
            padding:15px;
            border-radius:8px;
            margin-top:10px;
        }

        input{
            width:350px;
            padding:12px;
            margin-bottom:10px;
        }

        button{
            margin-top:20px;
            padding:12px 30px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            padding:15px;
            border-radius:8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            display: none;
        }

        #result.success{
            background:#d4edda;
            color:#155724;
            display:block;
        }

        #result.error{
            background:#f8d7da;
            color:#721c24;
            display:block;
        }

    </style>

</head>

<body>


<h2>Stripe Payment Test</h2>


<input
id="card-holder-name"
placeholder="Name">


<div id="card-element"></div>


<button id="pay">
    Pay
</button>

<div id="result"></div>


<script>
    // ⚠️ الملف ده static (مش بيتعالج بـ Blade)
    const stripe = Stripe('pk_test_51TyvwA22Zz086J0h89eAh6PKmO0GavJcTFergIMP0E1UWcYTLkLgWLhQAAMqSsSWQ9DZ93q4G3b8D1jlmOoMQOz500zKkmLcuS');

    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    const payButton = document.getElementById('pay');
    const resultDiv = document.getElementById('result');

    // API token (JWT) — تم توليده من auth('api')->login($user)
const API_TOKEN = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwMDAiLCJpYXQiOjE3ODU2NTYzMTgsImV4cCI6MTc4NTY1OTkxOCwibmJmIjoxNzg1NjU2MzE4LCJqdGkiOiJNSVlYWHZVZmlwQkNNY0t1Iiwic3ViIjoiMzEiLCJwcnYiOiIyM2JkNWM4OTQ5ZjYwMGFkYjM5ZTcwMWM0MDA4NzJkYjdhNTk3NmY3In0.Nd0tdqA_3N6Po2YcRvDxMXizdFlxhHTXB6fN-TDQsoA';
    const PLAN_ID = 1; // خد الـ id بتاع باقة تجريبية عندك

    function showResult(message, isError = false) {
        resultDiv.textContent = message;
        resultDiv.className = isError ? 'error' : 'success';
    }

    payButton.addEventListener('click', async () => {
        payButton.disabled = true;
        payButton.textContent = 'Processing...';

        try {
            // ============ الخطوة 1: نجيب client_secret من create() ============
            const createRes = await fetch('/api/payments/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + API_TOKEN,
                },
                body: JSON.stringify({ plan_id: PLAN_ID }),
            });

            const createData = await createRes.json();

            if (!createRes.ok) {
                throw new Error('create() failed: ' + JSON.stringify(createData));
            }

            const clientSecret = createData.data.client_secret;

            // ============ الخطوة 2: نأكد الكارت مع Stripe مباشرة ============
            const { setupIntent, error: setupError } = await stripe.confirmCardSetup(
                clientSecret,
                {
                    payment_method: {
                        card: cardElement,
                        billing_details: {
                            name: document.getElementById('card-holder-name').value,
                        },
                    },
                }
            );

            if (setupError) {
                throw new Error('confirmCardSetup failed: ' + setupError.message);
            }

            const paymentMethodId = setupIntent.payment_method;
            console.log('payment_method_id:', paymentMethodId);

            // ============ الخطوة 3: ننشئ الاشتراك فعليًا ============
            const subRes = await fetch('/api/payments/subscription', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + API_TOKEN,
                },
                body: JSON.stringify({
                    plan_id: PLAN_ID,
                    payment_method_id: paymentMethodId,
                }),
            });

            const subData = await subRes.json();

            if (!subRes.ok) {
                throw new Error('subscription() failed: ' + JSON.stringify(subData));
            }

            // ============ الخطوة 4: لو محتاج 3D Secure، نكمل التأكيد ============
            if (subData.data.requires_action) {
                const { paymentIntent, error: confirmError } = await stripe.confirmCardPayment(
                    subData.data.client_secret
                );

                if (confirmError) {
                    throw new Error('3DS confirmation failed: ' + confirmError.message);
                }

                showResult('تم الدفع بنجاح بعد 3D Secure ✅\n' + JSON.stringify(paymentIntent, null, 2));
            } else {
                showResult('تم إنشاء الاشتراك بنجاح ✅\n' + JSON.stringify(subData.data, null, 2));
            }

        } catch (err) {
            console.error(err);
            showResult('❌ ' + err.message, true);
        } finally {
            payButton.disabled = false;
            payButton.textContent = 'Pay';
        }
    });
</script>

</body>
</html>

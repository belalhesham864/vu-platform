name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            # 1. Pull new code so the volume sees it
            git pull origin main

            # 2. Login to GHCR using PAT (GITHUB_TOKEN doesn't work for read on server)
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull the new image and start containers
            docker compose pull
            docker compose up -d

            # 4. Run any new migrations
            docker compose exec -T app php artisan migrate --force

            # 5. Install any new composer packages
            docker compose exec -T app composer install --no-dev --no-interaction 2>/dev/null || true

            # 6. Clear Laravel caches
            docker compose exec -T app php artisan optimize:clear

            # 7. Clean old unused images to free disk space
            docker image prune -f

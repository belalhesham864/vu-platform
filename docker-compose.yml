
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vu-platform-app
    container_name: vu-platform-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - vu-platform-network
    depends_on:
      - db
      - redis
    entrypoint: ["/var/www/entrypoint.sh", "php-fpm"]

  web:
    image: nginx:alpine
    container_name: vu-platform-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./certbot/conf/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf
      - ./certbot/conf/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem
    networks:
      - vu-platform-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: vu-platform-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vu_platform}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - vu-platform-network

  redis:
    image: redis:alpine
    container_name: vu-platform-redis
    restart: unless-stopped
    networks:
      - vu-platform-network

  certbot:
    image: certbot/certbot
    container_name: vu-platform-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./certbot/conf/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf
      - ./certbot/conf/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem
      - ./:/var/www/public # This matches the Nginx root for acme-challenge
    networks:
      - vu-platform-network
    depends_on:
      - web
    command: "certbot renew --webroot -w /var/www/public --post-hook \"nginx -s reload\""

networks:
  vu-platform-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  certbot-etc:
  certbot-var:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vu-platform-app
    container_name: vu-platform-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - vu-platform-network
    depends_on:
      - db
      - redis
    entrypoint: ["/var/www/entrypoint.sh", "php-fpm"]

  web:
    image: nginx:alpine
    container_name: vu-platform-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vu-platform-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: vu-platform-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vu_platform}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - vu-platform-network

  redis:
    image: redis:alpine
    container_name: vu-platform-redis
    restart: unless-stopped
    networks:
      - vu-platform-network

networks:
  vu-platform-network:
    driver: bridge

volumes:
  dbdata:
    driver: local

services:
  app:
    build:
      context: .
    restart: unless-stopped
    entrypoint: ["entrypoint.sh"]
    command: ["php-fpm"]
    env_file: .env
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - vu-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["entrypoint.sh"]
    env_file: .env
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - vu-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    networks:
      - vu-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - vu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - vu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  vu-network:
    driver: bridge

volumes:
  db-data:
    name: vu-platform_db-data
    external: true
  certbot-etc:
    name: vu-platform_certbot-etc
    external: true
  certbot-var:
    name: vu-platform_certbot-var
    external: true
  app-code:
    name: vu-platform_app-code
    external: true

services:
  app:
    image: ghcr.io/belalhesham864/vu-platform:latest
    restart: unless-stopped
    env_file: .env
    # تمت إزالة مجلد ./:/var/www لكي يقرأ Docker الكود الجديد من GitHub مباشرة
    networks:
      - vu-network
    depends_on:
      - db
      - redis

  queue-worker:
    image: ghcr.io/belalhesham864/vu-platform:latest
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work
    networks:
      - vu-network
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    networks:
      - vu-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - vu-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - vu-network

networks:
  vu-network:
    driver: bridge

volumes:
  db-data:
  certbot-etc:
  certbot-var:
